[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-orchestration"
version = "0.1.0"
description = "A local-first, evidence-aware orchestration harness for public-equity research agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AlphaOrchestration contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "textual>=0.80,<9",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
alpha-orchestrate = "alpha_orchestration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alpha_orchestration = ["tui/*.tcss"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

